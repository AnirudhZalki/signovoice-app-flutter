name: signovoice
description: "SignoVoice - Breaking Barriers. AI-powered sign-language communication and learning."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

razorpay_flutter: ^1.4.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State, routing
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  equatable: ^3.0.0
  intl: ^0.20.2



  # Firebase (behind repository interfaces; see docs/EXTERNAL_SETUP.md)
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  firebase_messaging: ^16.7.0
  google_sign_in: ^7.2.0

  # Camera / AI
  camera: ^0.12.1
  hand_landmarker: ^3.1.0
  flutter_onnxruntime: ^1.8.5
  flutter_litert: ^3.9.3

  # Speech
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0

  # Payments, realtime
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3
  razorpay_flutter: ^1.4.7
  livekit_client: ^2.13.0

  # Platform / storage / network
  permission_handler: ^13.0.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  connectivity_plus: ^7.3.1
  dio: ^5.11.1
  video_player: ^2.14.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  package_info_plus: ^10.2.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/models/
    - assets/videos/
    - assets/data/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
