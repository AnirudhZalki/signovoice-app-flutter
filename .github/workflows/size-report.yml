name: App size report

# Manual: Actions -> "App size report" -> Run workflow. Prints what makes the app big (see the run's Summary).
on:
  workflow_dispatch:

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the phone-sized APK (arm64) with size analysis
        run: >
          flutter build apk --release --split-per-abi --target-platform android-arm64
          --obfuscate --split-debug-info=build/symbols --analyze-size
          --dart-define-from-file=config/dev.example.json
      - name: Report
        run: |
          f=$(ls build/app/outputs/flutter-apk/*arm64-v8a-release.apk | head -1)
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/size/apk_report.py "$f" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: size-analysis
          path: |
            build/app/outputs/flutter-apk/*arm64-v8a-release.apk
            ${{ runner.temp }}/*code-size-analysis*.json
            ~/.flutter-devtools/*code-size-analysis*.json
          if-no-files-found: ignore
