name: Build release AAB

# Manual: GitHub → Actions → "Build release AAB" → Run workflow. Download the .aab from the run's Artifacts.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "versionCode (must be higher than the last upload to Play)"
        required: true
        default: "2"
      build_name:
        description: "versionName shown to users"
        required: true
        default: "1.0.0"

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Secrets (Settings → Secrets and variables → Actions): see docs/EXTERNAL_SETUP.md "Building the Play Store bundle".
      - name: Upload keystore + key.properties
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$UPLOAD_KEYSTORE_BASE64" || { echo "::error::Secret UPLOAD_KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-upload}"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set: the app will build without Firebase (sign-in disabled)."
          fi

      - name: Build-time config (optional)
        env:
          PROD_CONFIG_JSON: ${{ secrets.PROD_CONFIG_JSON }}
        run: |
          if [ -n "$PROD_CONFIG_JSON" ]; then echo "$PROD_CONFIG_JSON" > config/prod.json; else cp config/prod.example.json config/prod.json; fi

      - run: flutter pub get
      - run: flutter build appbundle --release --build-name=${{ inputs.build_name }} --build-number=${{ inputs.build_number }} --dart-define-from-file=config/prod.json

      - uses: actions/upload-artifact@v4
        with:
          name: signovoice-${{ inputs.build_name }}+${{ inputs.build_number }}-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
